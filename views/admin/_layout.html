<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{{ meta.title }} · Admin · {{ site.brand_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}">
</head>
<body class="admin">
  <header class="admin-header">
    <div class="container header-inner">
      <a class="logo" href="{{ url_for('admin.index') }}">{{ site.brand_name }} admin</a>
      {% if session.get('admin') %}
      <form method="post" action="{{ url_for('admin.logout') }}">
        <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
        <button class="btn btn-ghost" type="submit">Log out</button>
      </form>
      {% endif %}
    </div>
  </header>
  <main class="section"><div class="container">{% block content %}{% endblock %}</div></main>
</body>
</html>
