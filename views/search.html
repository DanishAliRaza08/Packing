{% extends "base.html" %}

{% block content %}
<section class="section">
  <div class="container narrow">
    <h1>Search</h1>
    <form class="search-form" action="{{ link('search') }}" role="search">
      <label for="q" class="sr-only">Search the site</label>
      <input id="q" name="q" type="search" value="{{ q }}" placeholder="e.g. candle boxes, prices, eco">
      <button class="btn btn-primary" type="submit">Search</button>
    </form>
    {% if q %}
      {% if results %}
      <ul class="search-results">
        {% for _, title, desc, url in results %}<li><a href="{{ url }}">{{ title }}</a><p>{{ desc }}</p></li>{% endfor %}
      </ul>
      {% else %}
      <p>No pages matched “{{ q }}”. Try another word, or <a href="{{ link('contact') }}">ask us</a>.</p>
      {% endif %}
    {% endif %}
  </div>
</section>
{% endblock %}
